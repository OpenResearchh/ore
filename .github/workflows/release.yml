name: Release

# Emergency CI cut. The normal path is local:
#   cd Apps/OreMac && ./Scripts/certify-release.sh [patch|minor|major]
# That runs tests and builds the DMG on a Mac that already has the SDK,
# then publishes whatever is on master. This workflow exists so a release
# can still be cut when that machine is not around. Merges to master do
# not ship a DMG on their own.
#
# The version-bump commit is pushed with GITHUB_TOKEN, whose pushes do not
# retrigger workflows; the `[skip ci]` marker is belt-and-braces.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which version part to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, build DMG, publish
    # Must match the OreMac CI job: the DMG builds the same target, which needs
    # the macOS 26 SDK for the Liquid Glass symbols behind its availability
    # checks.
    runs-on: macos-26
    defaults:
      run:
        working-directory: Apps/OreMac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: echo "version=$(./Scripts/bump-version.sh ${{ inputs.bump }})" >> "$GITHUB_OUTPUT"

      - name: Commit the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:master

      - name: Build the DMG
        run: ./Scripts/make-dmg.sh release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            ".build/ORE-${{ steps.bump.outputs.version }}.dmg" \
            --title "ORE v${{ steps.bump.outputs.version }}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
