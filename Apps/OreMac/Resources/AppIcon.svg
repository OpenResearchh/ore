<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="0.55" stop-color="#5A6BF6"/>
      <stop offset="1" stop-color="#8250F4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="112" x2="0" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App tile: a rounded squircle, the macOS way. -->
  <rect x="112" y="112" width="800" height="800" rx="196" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="196" fill="url(#sheen)"/>

  <!-- Stacked layers = several agents running in parallel, each in its own
       worktree. Drawn bottom-first so the top plate reads as the front one. -->
  <g stroke="#3A46C8" stroke-opacity="0.28" stroke-width="6" stroke-linejoin="round">
    <path d="M512 604 L716 706 L512 808 L308 706 Z" fill="#ffffff" fill-opacity="0.60"/>
    <path d="M512 456 L716 558 L512 660 L308 558 Z" fill="#ffffff" fill-opacity="0.80"/>
    <path d="M512 308 L716 410 L512 512 L308 410 Z" fill="#ffffff" fill-opacity="0.97"/>
  </g>
</svg>
