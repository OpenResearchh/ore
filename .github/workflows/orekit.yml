name: ORE

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Once the repository is public, anyone can open a pull request that runs this
# workflow. The token it gets should only ever read, whatever the repository
# default is set to later; nothing here needs to write.
permissions:
  contents: read

# A new push to a pull request makes its running checks obsolete, and two of
# the three jobs hold macOS runners, so the older run is cancelled. Pushes to
# master are left to finish: each merge should get its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: OreKit (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: Packages/OreKit
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # Golden-transcript tests replay recorded CLI output, so the whole suite
      # runs offline: no agent CLI installed, no subscription, no model
      # requests. Git tests use real throwaway repositories.
      - name: Test
        run: swift test

  linux:
    name: OreKit (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.3
    defaults:
      run:
        working-directory: Packages/OreKit
    steps:
      - uses: actions/checkout@v4

      # GRDB compiles against the system SQLite, and the Swift container ships
      # the library but not its headers — so the build failed on a missing
      # `sqlite3.h` rather than on anything in this repository.
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev

      # The headless core is written to avoid Apple-only API so that a hosted
      # version of ORE stays possible. That claim is only worth anything if
      # something checks it — the drivers, git engine and persistence all build
      # here, and only the FSEvents watcher is compiled out (it falls back to
      # polling).
      - name: Build the headless core
        run: swift build --product OreCore

      - name: Test
        run: swift test

  app:
    name: OreMac
    # macOS 26, not 15: the app adopts Liquid Glass behind `if #available`, and
    # an availability check still has to compile — on the macOS 15 SDK
    # `glassEffect` and `.glassProminent` don't exist as symbols at all, so the
    # whole target failed to build. OreKit stays on macos-15 since it uses no
    # Apple UI API and passes there.
    runs-on: macos-26
    defaults:
      run:
        working-directory: Apps/OreMac
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      # When the test process itself crashes rather than a test failing,
      # SwiftPM only says "unexpected signal code 11" and prints no backtrace.
      # macOS still writes a crash report; print its faulting thread so the
      # frame that crashed is in the log.
      - name: Show crash reports
        if: failure()
        run: |
          sleep 10
          shopt -s nullglob
          for report in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "::group::$(basename "$report")"
            python3 - "$report" <<'PY'
          import json, sys
          _, _, body = open(sys.argv[1]).read().partition("\n")
          report = json.loads(body)
          images = report.get("usedImages", [])
          threads = report.get("threads", [])
          faulting = report.get("faultingThread", 0)
          print("exception:", report.get("exception"))
          print("termination:", report.get("termination", {}).get("indicator"))
          print("faulting thread:", faulting)
          frames = threads[faulting].get("frames", []) if faulting < len(threads) else []
          for frame in frames[:60]:
              index = frame.get("imageIndex", -1)
              image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
              symbol = frame.get("symbol") or hex(frame.get("imageOffset", 0))
              where = f" {frame['sourceFile']}:{frame.get('sourceLine', '')}" if frame.get("sourceFile") else ""
              print(f"  {image:32} {symbol}{where}")
          PY
            echo "::endgroup::"
          done

      - name: Build the app bundle
        run: ./Scripts/bundle.sh release

      # A pull request still has to build the bundle, but its app is built
      # from code nobody has reviewed yet, so it isn't published as a
      # downloadable artifact. Only master builds are, and not for long:
      # releases are the way to get ORE.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ORE.app
          path: Apps/OreMac/.build/ORE.app
          if-no-files-found: error
          retention-days: 7
